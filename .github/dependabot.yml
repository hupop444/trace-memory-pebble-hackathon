version: 2
updates:
  - package-ecosystem: npm
    directory: /software
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      software-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /hardware/bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /hardware/enclosure
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
