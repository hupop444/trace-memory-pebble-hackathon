<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRACE Hardware Link</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Microsoft YaHei", sans-serif;
      color: #292622;
      background: #f3f1ed;
      letter-spacing: 0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #f3f1ed; }
    header, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid #d3cec7;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 24px; font-weight: 720; }
    h2 { margin-top: 4px; font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
    .summary, .device-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      color: #7a5549;
      font-size: 14px;
      font-weight: 650;
    }
    .summary::before, .device-status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #b4604e;
    }
    .summary[data-connected="true"], .device-status[data-connected="true"] { color: #246f52; }
    .summary[data-connected="true"]::before, .device-status[data-connected="true"]::before { background: #25865f; }
    main { padding: 28px 0 48px; }
    .overview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 220px));
      gap: 1px;
      width: fit-content;
      margin-bottom: 24px;
      border: 1px solid #d3cec7;
      background: #d3cec7;
    }
    .overview div { min-width: 180px; padding: 14px 16px; background: #fff; }
    .overview span, .device-metrics span, .last-event span { display: block; color: #736d65; font-size: 12px; }
    .overview strong { display: block; margin-top: 6px; font-size: 21px; font-variant-numeric: tabular-nums; }
    .device-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .device {
      min-width: 0;
      padding: 20px;
      border: 1px solid #cec8c0;
      border-radius: 8px;
      background: #fff;
    }
    .device-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .eyebrow { color: #8a8279; font: 700 11px/1.2 Consolas, monospace; }
    .device-id, .endpoint { overflow-wrap: anywhere; color: #797169; font: 12px/1.45 Consolas, monospace; }
    .device-id { margin-top: 14px; color: #4c4741; }
    .endpoint { min-height: 35px; margin-top: 3px; }
    .device-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 18px;
      border-top: 1px solid #ded9d2;
      border-left: 1px solid #ded9d2;
    }
    .device-metrics div { min-width: 0; padding: 12px; border-right: 1px solid #ded9d2; border-bottom: 1px solid #ded9d2; }
    .device-metrics strong { display: block; margin-top: 7px; font-size: 19px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .last-event { display: flex; justify-content: space-between; gap: 12px; min-height: 54px; padding: 15px 0; border-bottom: 1px solid #ded9d2; }
    .last-event strong { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
    button {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #39342f;
      border-radius: 6px;
      background: #fff;
      color: #292622;
      font: 600 13px/1.2 inherit;
      cursor: pointer;
    }
    button.primary { background: #39342f; color: #fff; }
    button:disabled { cursor: not-allowed; opacity: .38; }
    .protocol { margin-top: 28px; padding-top: 20px; border-top: 1px solid #d3cec7; }
    .protocol h2 { margin: 0 0 12px; font-size: 15px; }
    .log { height: 210px; overflow: auto; padding: 14px 16px; background: #211f1c; color: #e9e4dc; font: 12px/1.7 Consolas, monospace; }
    @media (max-width: 900px) { .device-list { grid-template-columns: 1fr; } }
    @media (max-width: 560px) {
      header { min-height: 72px; }
      h1 { font-size: 19px; }
      .overview { width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .overview div { min-width: 0; }
      .device { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TRACE Hardware Link</h1>
    <span class="summary" data-summary>连接中</span>
  </header>
  <main>
    <div class="overview">
      <div><span>在线设备</span><strong data-connected-count>0 / 3</strong></div>
      <div><span>总捏压事件</span><strong data-total-events>0</strong></div>
    </div>
    <section class="device-list" data-device-list aria-label="Pebble 设备"></section>
    <section class="protocol">
      <h2>协议日志</h2>
      <div class="log" data-log aria-live="polite"></div>
    </section>
  </main>
  <script src="./trace-device-config.js"></script>
  <script type="module" src="./demo-app.js"></script>
</body>
</html>
